name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Build Frontend
        run: npm run build

  contract-test:
    name: Soroban Contract Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rust-src

      - name: Run Contract Tests
        run: |
          cd contract
          cargo test

  contract-build:
    name: Soroban Contract Building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rust-src

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.0.0

      - name: Build Contract Wasm
        run: |
          cd contract
          cargo build --target wasm32v1-none --release
